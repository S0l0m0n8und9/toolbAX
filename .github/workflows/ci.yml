name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Restore
        run: dotnet restore .\FoToolbox.sln

      - name: Build
        run: dotnet build .\FoToolbox.sln -c Release --no-restore

      # Unit tests only — UI tests run in the isolated `ui-tests` job so a flaky
      # offscreen render never masks the unit-test signal. The full solution is still
      # built above, so a UI-project compile break still fails this job.
      - name: Test
        run: dotnet test .\tests\FoToolbox.Tests\FoToolbox.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 150s --blame-hang-dump-type mini --results-directory ${{ github.workspace }}\TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}\TestResults
          if-no-files-found: ignore

      - name: Vulnerable packages
        shell: pwsh
        run: |
          # `dotnet list package --vulnerable` exits 0 even when it finds advisories, so parse the
          # output and fail the build when any project reports a vulnerable package.
          $out = dotnet list .\FoToolbox.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') {
            throw "Vulnerable NuGet packages detected (see the list above)."
          }

  ui-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Restore
        run: dotnet restore .\FoToolbox.sln

      - name: Build UI tests
        run: dotnet build .\tests\FoToolbox.UiTests\FoToolbox.UiTests.csproj -c Release --no-restore

      - name: Run UI tests
        run: dotnet test .\tests\FoToolbox.UiTests\FoToolbox.UiTests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 150s --blame-hang-dump-type mini --results-directory ${{ github.workspace }}\UiTestResults

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ${{ github.workspace }}\UiTestResults
          if-no-files-found: ignore

  e2e-tests:
    runs-on: windows-latest
    continue-on-error: true   # advisory until the GUI E2E suite is proven stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Restore
        run: dotnet restore .\FoToolbox.sln

      - name: Build
        run: dotnet build .\FoToolbox.sln -c Release --no-restore

      - name: Run E2E tests
        run: dotnet test .\tests\FoToolbox.E2eTests\FoToolbox.E2eTests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 180s --blame-hang-dump-type mini --results-directory ${{ github.workspace }}\E2eResults

      - name: Upload E2E results + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ${{ github.workspace }}\E2eResults
            ${{ github.workspace }}\tests\FoToolbox.E2eTests\bin\Release\net10.0-windows\e2e-screenshots
          if-no-files-found: ignore

  # Alternate UI host spike (#35): the toolBax Avalonia app + its headless UI tests. Runs on
  # ubuntu-latest with NO display server — the reason Avalonia was chosen over WPF/WinUI. No xvfb,
  # no virtual desktop; if this stays green on a bare Linux runner the framework choice is paying off.
  avalonia-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props

      - name: Restore
        run: dotnet restore ./avalonia/toolBax.slnx

      - name: Build
        run: dotnet build ./avalonia/toolBax.slnx -c Release --no-restore

      # The shipped artifact is the Avalonia app, so its dependency graph is the one that matters most.
      # `dotnet list package --vulnerable` exits 0 even on a hit, so parse and fail explicitly.
      - name: Vulnerable packages (shipping graph)
        shell: bash
        run: |
          out=$(dotnet list ./avalonia/toolBax.slnx package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages detected in the shipping graph (see the list above)."
            exit 1
          fi

      - name: Run Avalonia headless tests (no display server)
        run: dotnet test ./avalonia/toolBax.App.Tests/toolBax.App.Tests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type mini --results-directory ${{ github.workspace }}/AvaloniaTestResults

      - name: Upload Avalonia test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-test-results
          path: ${{ github.workspace }}/AvaloniaTestResults
          if-no-files-found: ignore
