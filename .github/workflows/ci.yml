name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit resolved by release
        required: true
        type: string
      package_version:
        required: true
        type: string
      file_version:
        required: true
        type: string

permissions:
  contents: read
env:
  CI: 'true'
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-ci' }}
  FILE_VERSION: ${{ inputs.file_version || '0.0.0.0' }}
defaults:
  run:
    shell: pwsh

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props
      - name: Validate source and release helpers
        run: |
          . ./scripts/ci/ReleaseTools.ps1
          Assert-BuildInputs $env:SOURCE_SHA $env:PACKAGE_VERSION $env:FILE_VERSION
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Wrong source checkout.' }
          ./scripts/ci/Test-ReleaseTools.ps1
      - name: Restore and build Core Release
        run: |
          dotnet restore ./FoToolbox.sln
          if ($LASTEXITCODE -ne 0) { throw 'Core restore failed.' }
          dotnet build ./FoToolbox.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed.' }
      - name: Test Core on Windows
        run: |
          dotnet test ./tests/FoToolbox.Tests/FoToolbox.Tests.csproj -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 150s --results-directory artifacts/core-tests
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Audit Core solution including test dependencies
        run: ./scripts/ci/Assert-PackageAudit.ps1 -Project ./FoToolbox.sln -OutputPath artifacts/core-solution-audit.json
      - name: Upload Core results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: core-test-results
          path: |
            artifacts/core-tests
            artifacts/core-solution-audit.json*
          archive: true
          if-no-files-found: ignore

  avalonia-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props
      - name: Build and test supported Linux headless path
        run: |
          . ./scripts/ci/ReleaseTools.ps1
          Assert-BuildInputs $env:SOURCE_SHA $env:PACKAGE_VERSION $env:FILE_VERSION
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Wrong source checkout.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet restore ./avalonia/toolBax.slnx -p:EnableWebView2=false
          if ($LASTEXITCODE -ne 0) { throw 'Linux restore failed.' }
          dotnet build ./avalonia/toolBax.slnx -c Release --no-restore -p:EnableWebView2=false 2>&1 | Tee-Object artifacts/app-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Linux App build failed.' }
          if (-not (Select-String -Path artifacts/app-build.log -Pattern 'FoToolbox.Core -> .*[/\\]Release[/\\]net10.0[/\\]FoToolbox.Core.dll')) { throw 'Shared Core was not built in Release.' }
          if (Select-String -Path artifacts/app-build.log -Pattern 'FoToolbox.Core -> .*[/\\]Debug[/\\]') { throw 'Debug Core leaked into Release solution.' }
          dotnet test ./avalonia/toolBax.App.Tests/toolBax.App.Tests.csproj -c Release --no-build -p:EnableWebView2=false --logger trx --blame-hang --blame-hang-timeout 90s --results-directory artifacts/app-tests
          if ($LASTEXITCODE -ne 0) { throw 'Linux App tests failed.' }
      - name: Audit Linux App solution including test dependencies
        run: ./scripts/ci/Assert-PackageAudit.ps1 -Project ./avalonia/toolBax.slnx -OutputPath artifacts/app-solution-audit.json
      - name: Upload Linux results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: avalonia-test-results
          path: |
            artifacts/app-tests
            artifacts/app-build.log
            artifacts/app-solution-audit.json*
          archive: true
          if-no-files-found: ignore

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Packages.props
      - name: Build and test Windows App with WebView2
        run: |
          . ./scripts/ci/ReleaseTools.ps1
          Assert-BuildInputs $env:SOURCE_SHA $env:PACKAGE_VERSION $env:FILE_VERSION
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Wrong source checkout.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet restore ./avalonia/toolBax.slnx -p:EnableWebView2=true
          if ($LASTEXITCODE -ne 0) { throw 'Windows restore failed.' }
          dotnet build ./avalonia/toolBax.slnx -c Release --no-restore -p:EnableWebView2=true 2>&1 | Tee-Object artifacts/app-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows App build failed.' }
          if (-not (Select-String -Path artifacts/app-build.log -Pattern 'FoToolbox.Core -> .*[/\\]Release[/\\]net10.0[/\\]FoToolbox.Core.dll')) { throw 'Shared Core was not built in Release.' }
          if (Select-String -Path artifacts/app-build.log -Pattern 'FoToolbox.Core -> .*[/\\]Debug[/\\]') { throw 'Debug Core leaked into Release solution.' }
          dotnet test ./avalonia/toolBax.App.Tests/toolBax.App.Tests.csproj -c Release --no-build -p:EnableWebView2=true --logger trx --blame-hang --blame-hang-timeout 90s --results-directory artifacts/app-tests
          if ($LASTEXITCODE -ne 0) { throw 'Windows App tests failed.' }
      - name: Audit Windows App solution including test dependencies
        run: ./scripts/ci/Assert-PackageAudit.ps1 -Project ./avalonia/toolBax.slnx -OutputPath artifacts/app-solution-audit.json
      - name: Audit shipping dependency graph
        run: ./scripts/ci/Assert-PackageAudit.ps1
      - name: Upload Windows results and audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: windows-app-results
          path: |
            artifacts/app-tests
            artifacts/app-build.log
            artifacts/app-solution-audit.json*
            artifacts/package-audit.json*
          archive: true
          if-no-files-found: ignore

  package-smoke:
    needs: [build-test, avalonia-tests, windows-app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          global-json-file: global.json
      - name: Publish, archive, extract and smoke the real Windows application
        run: ./scripts/ci/Build-SmokePackage.ps1 -SourceSha $env:SOURCE_SHA -PackageVersion $env:PACKAGE_VERSION -FileVersion $env:FILE_VERSION
      - name: Upload only the archive and checksum that passed smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: tested-package-${{ inputs.source_sha || github.sha }}
          path: |
            artifacts/package/toolbAX-win-x64.zip
            artifacts/package/toolbAX-win-x64.zip.sha256
          archive: true
          if-no-files-found: error
      - name: Upload package smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: package-smoke-evidence
          path: |
            artifacts/package/publish.log
            artifacts/package/smoke-*/report.json
            artifacts/package/smoke-*/stdout.log
            artifacts/package/smoke-*/stderr.log
          archive: true
          if-no-files-found: ignore
