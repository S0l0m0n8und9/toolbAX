name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag (optional prerelease/build metadata)
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
      package_version: ${{ steps.tag.outputs.package_version }}
      file_version: ${{ steps.tag.outputs.file_version }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          fetch-depth: 0
      - name: Validate existing tag and resolve immutable source
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/ci/Resolve-ReleaseTag.ps1 -Tag $env:RELEASE_TAG

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      package_version: ${{ needs.resolve.outputs.package_version }}
      file_version: ${{ needs.resolve.outputs.file_version }}

  publish:
    needs: [resolve, verify]
    if: ${{ needs.resolve.result == 'success' && needs.verify.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact tested archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        with:
          name: tested-package-${{ needs.resolve.outputs.source_sha }}
          path: release-assets
      - name: Check tested checksum and final tag consistency
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          VERIFIED_SHA: ${{ needs.resolve.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sum = (Get-Content release-assets/toolbAX-win-x64.zip.sha256 -Raw).Trim()
          if ($sum -cnotmatch '\A([0-9a-f]{64})  toolbAX-win-x64\.zip\z') { throw 'Invalid tested checksum.' }
          if ((Get-FileHash release-assets/toolbAX-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $Matches[1]) { throw 'Tested archive checksum changed.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $base = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $object = (Invoke-RestMethod -Uri "$base/git/ref/tags/$tag" -Headers $headers).object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 8; $depth++) {
            if ($object.sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Invalid tag object.' }
            $object = (Invoke-RestMethod -Uri "$base/git/tags/$($object.sha)" -Headers $headers).object
          }
          if ($object.type -ne 'commit' -or $object.sha -cne $env:VERIFIED_SHA) { throw 'Tag moved or disappeared after verification; refusing publication.' }
          @'
          ## toolbAX — portable Windows app

          Extract toolbAX-win-x64.zip and run toolbAX.exe. The .NET runtime is included; Microsoft Edge WebView2 Runtime remains a separate prerequisite.

          **Unsigned.** A signed release remains future work. Verify the supplied SHA-256 checksum against the downloaded archive.

          This exact archive passed Windows startup/package smoke after Core, Linux App and Windows App tests. Smoke does not validate live sign-in, portal behavior or every business feature.
          '@ | Set-Content -Encoding utf8 release-notes.md
      - name: Publish verified assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.source_sha }}
          files: |
            release-assets/toolbAX-win-x64.zip
            release-assets/toolbAX-win-x64.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release-notes.md
          prerelease: ${{ needs.resolve.outputs.is_prerelease == 'true' }}
