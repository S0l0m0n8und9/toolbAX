name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1). Must already exist on the repo."
        required: true

permissions:
  contents: write

env:
  RUNTIME_VERSION: "10.0.8"
  RUNTIME_URL: "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/10.0.8/windowsdesktop-runtime-10.0.8-win-x64.exe"

jobs:
  build:
    runs-on: windows-latest
    env:
      # Job-level boolean derived from the presence of signing secrets. GitHub Actions does
      # not allow `secrets.X != ''` directly inside step `if:` expressions; lifting it into
      # an env var is the standard workaround.
      HAS_SIGNING_CERT: ${{ secrets.SIGN_CERT_FILE_BASE64 != '' && secrets.SIGN_CERT_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install WiX CLI + extensions
        shell: pwsh
        run: |
          # Pin to WiX 6.x — v7 (default since late 2026) requires accepting the OSMF EULA
          # and gates dotnet tool exec behind it. The repo's bundle theme + extensions target
          # WiX 6.0.2 schemas; keep CI on the same major.
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.Bal.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Stage .NET Desktop Runtime payload
        shell: pwsh
        run: |
          $dest = "install/redist/windowsdesktop-runtime-${{ env.RUNTIME_VERSION }}-win-x64.exe"
          New-Item -ItemType Directory -Force -Path "install/redist" | Out-Null
          Invoke-WebRequest -Uri "${{ env.RUNTIME_URL }}" -OutFile $dest

      - name: Materialise signing cert from secret
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.SIGN_CERT_FILE_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_BASE64))
          "SIGN_PFX_PATH=$pfxPath" | Out-File -Append $env:GITHUB_ENV

      - name: Build installer bundle (signed Release)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File install/build.ps1 `
            -Configuration Release `
            -SignCertificateFile $env:SIGN_PFX_PATH `
            -SignCertificatePassword $env:SIGN_CERT_PASSWORD

      - name: Build installer bundle (unsigned Debug fallback)
        if: env.HAS_SIGNING_CERT != 'true'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File install/build.ps1 -Configuration Debug

      - name: Wipe signing cert from runner
        if: always() && env.HAS_SIGNING_CERT == 'true' && env.SIGN_PFX_PATH != ''
        shell: pwsh
        run: |
          if (Test-Path $env:SIGN_PFX_PATH) {
            Remove-Item $env:SIGN_PFX_PATH -Force
          }

      - name: Verify bundle was produced
        shell: pwsh
        run: |
          if (-not (Test-Path install/FoToolboxBundle.exe)) {
            throw "install/FoToolboxBundle.exe was not produced by build.ps1."
          }
          Get-Item install/FoToolboxBundle.exe | Select-Object Name, Length, LastWriteTime

      - name: Compose signed release notes
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        run: |
          @'
          ## FOtoolbox installer bundle

          Downloads the .NET 10 Desktop Runtime if missing, then installs the app to `%LOCALAPPDATA%\FoToolbox\` (per-user).

          Signed with the FOtoolbox code-signing certificate. If your machine doesn't trust the issuer, Windows may still prompt — this is normal for newer/less-established publishers and resolves once SmartScreen accumulates download reputation.

          See the auto-generated change log below for what's new.
          '@ | Out-File -Encoding utf8 release-notes.md

      - name: Compose unsigned release notes
        if: env.HAS_SIGNING_CERT != 'true'
        shell: pwsh
        run: |
          @'
          ## FOtoolbox installer bundle

          Downloads the .NET 10 Desktop Runtime if missing, then installs the app to `%LOCALAPPDATA%\FoToolbox\` (per-user).

          > ⚠️ **Unsigned bundle.** Windows SmartScreen will show "Windows protected your PC" — click **More info** → **Run anyway**. A signed release path is on the roadmap.

          See the auto-generated change log below for what's new.
          '@ | Out-File -Encoding utf8 release-notes.md

      - name: Publish release with bundle asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: install/FoToolboxBundle.exe
          generate_release_notes: true
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'v0.') || contains(github.event.inputs.tag || github.ref_name, '-') }}
