name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Must already exist on the repo."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag $tag -> version $version"

      - name: Publish self-contained (win-x64)
        shell: pwsh
        run: |
          dotnet publish avalonia/toolBax.App/toolBax.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:FileVersion=${{ steps.ver.outputs.version }} `
            -o publish

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          if (-not (Test-Path publish/toolbAX.exe)) {
            throw "publish/toolbAX.exe was not produced by dotnet publish."
          }
          Get-Item publish/toolbAX.exe | Select-Object Name, Length, LastWriteTime

      - name: Zip the portable app
        shell: pwsh
        run: |
          # Drop debug symbols (PDBs) and package XML doc files so the release asset stays lean —
          # neither is needed at runtime by the self-contained single-file app. PDBs come from the
          # Core project refs (which -p:DebugType doesn't reliably suppress across references); the
          # *.xml IntelliSense docs leak out of the WebView2 NuGet package.
          Get-ChildItem publish -Recurse -File | Where-Object { $_.Extension -in '.pdb', '.xml' } | Remove-Item -Force
          Compress-Archive -Path publish/* -DestinationPath toolbAX-win-x64.zip -Force

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          # The release is unsigned, so a published checksum is the only way a user can verify the
          # download wasn't tampered with or corrupted in transit.
          $hash = (Get-FileHash toolbAX-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  toolbAX-win-x64.zip" | Out-File -Encoding ascii toolbAX-win-x64.zip.sha256
          Write-Host "SHA-256: $hash"

      - name: Compose release notes
        shell: pwsh
        run: |
          @'
          ## toolbAX — portable app (Avalonia)

          Cross-platform Avalonia build of toolbAX. This is a **self-contained** Windows x64 build — no .NET runtime install required.

          **Install:** download `toolbAX-win-x64.zip`, extract it anywhere, and run `toolbAX.exe`.

          > ⚠️ **Unsigned.** Windows SmartScreen will show "Windows protected your PC" — click **More info** → **Run anyway**. A signed release path is on the roadmap.

          **Verify your download** (recommended while the release is unsigned): the `toolbAX-win-x64.zip.sha256` asset holds the expected SHA-256. Compare it with `Get-FileHash toolbAX-win-x64.zip -Algorithm SHA256`.

          See the auto-generated change log below for what's new.
          '@ | Out-File -Encoding utf8 release-notes.md

      - name: Publish release with portable zip
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            toolbAX-win-x64.zip
            toolbAX-win-x64.zip.sha256
          generate_release_notes: true
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'v0.') || contains(github.event.inputs.tag || github.ref_name, '-') }}
