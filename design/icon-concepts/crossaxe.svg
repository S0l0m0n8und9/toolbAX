<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#272361"/>
      <stop offset="1" stop-color="#1B1840"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F5FF"/>
      <stop offset="0.5" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#8B97E8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#E08C0B"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <radialGradient id="pivot" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#CFFAFE"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>
  <rect x="11.5" y="11.5" width="233" height="233" rx="52.5" fill="none" stroke="#A5B4FC" stroke-opacity="0.20" stroke-width="3"/>

  <!-- STEEL RING-SPANNER : bottom-left to top-right diagonal -->
  <g transform="rotate(-45 128 128)">
    <!-- shaft -->
    <rect x="60" y="116" width="136" height="24" rx="12" fill="url(#steel)"/>
    <!-- ring head (left) -->
    <circle cx="64" cy="128" r="30" fill="url(#steel)"/>
    <circle cx="64" cy="128" r="14" fill="#241F52"/>
    <!-- open-end head (right) -->
    <path d="M186 100 h18 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-18 v-16 h12 v-24 h-12 z" fill="url(#steel)"/>
    <!-- subtle top highlight on shaft -->
    <rect x="74" y="119" width="110" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <!-- GOLD SCREWDRIVER : top-left to bottom-right diagonal -->
  <g transform="rotate(45 128 128)">
    <!-- handle (grip, indigo) -->
    <rect x="52" y="112" width="70" height="32" rx="16" fill="url(#grip)"/>
    <rect x="62" y="116" width="4" height="24" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="76" y="116" width="4" height="24" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="90" y="116" width="4" height="24" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <!-- gold shaft -->
    <rect x="120" y="120" width="64" height="16" rx="8" fill="url(#gold)"/>
    <!-- flat tip -->
    <path d="M184 116 l18 12 l-18 12 z" fill="url(#gold)"/>
    <rect x="124" y="122" width="50" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- PIVOT RIVET at the crossing -->
  <circle cx="128" cy="128" r="17" fill="#1B1840"/>
  <circle cx="128" cy="128" r="13" fill="url(#pivot)"/>
  <circle cx="123.5" cy="123.5" r="4" fill="#ffffff" fill-opacity="0.7"/>
</svg>